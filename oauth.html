<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>BipolTrack · Auth</title>
<style>
  body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh;
    font-family: 'DM Sans', system-ui, sans-serif; background: #FFFFFF; color: #2B1810; }
  p { font-size: 15px; opacity: 0.6; }
</style>
</head>
<body>
<p>Authentification en cours…</p>
<script>
  (function () {
    var hash   = window.location.hash.slice(1);
    var search = window.location.search.slice(1);
    var params = new URLSearchParams(hash || search);

    var token     = params.get('access_token');
    var code      = params.get('code');
    var expiresIn = params.get('expires_in');
    var error     = params.get('error');

    var msg = code
      ? { type: 'bt-oauth-code',  code: code }
      : token
        ? { type: 'bt-oauth-token', token: token, expiresIn: expiresIn || '3600' }
        : { type: 'bt-oauth-error', error: error || 'unknown' };

    // Primary channel: postMessage (Chrome, Firefox, most browsers)
    if (window.opener) {
      try { window.opener.postMessage(msg, window.location.origin); } catch (e) {}
    }

    // Fallback channel: localStorage relay (Safari nulls window.opener after cross-origin popup navigation)
    try { localStorage.setItem('bt_oauth_relay', JSON.stringify(msg)); } catch (e) {}

    window.close();

    // In case close is blocked, show a fallback message
    setTimeout(function () {
      document.querySelector('p').textContent = 'Tu peux fermer cette fenêtre.';
    }, 300);
  })();
</script>
</body>
</html>
