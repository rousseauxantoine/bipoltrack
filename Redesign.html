<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BipolTrack — Redesign</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Crimson+Pro:ital,wght@0,300..700;1,300..700&family=DM+Sans:opsz,wght@9..40,300..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1a1612; font-family: 'DM Sans', sans-serif; }
  * { box-sizing: border-box; }
  #root { width: 100vw; height: 100vh; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="variations/v1-argile.jsx"></script>
<script type="text/babel" src="variations/argile-extras.jsx"></script>
<script type="text/babel" src="variations/v2-saison.jsx"></script>
<script type="text/babel" src="variations/v3-almanach.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

const PHONE_W = 390;
const PHONE_H = 844;

const INTRO = {
  argile:   { tag: '01 · Argile',   title: 'Argile',   subtitle: 'Éditorial, lent, en 3 temps. La saisie devient un rituel : Humeur → Corps → Mot.' },
  saison:   { tag: '02 · Saison',   title: 'Saison',   subtitle: 'Votre journée comme une météo intérieure. Un ciel illustré qui change avec l\u2019humeur.' },
  almanach: { tag: '03 · Almanach', title: 'Almanach', subtitle: 'Un carnet imprimé, en chapitres numérotés. Long, intime, à colonnes.' },
};

function IntroCard({ data }) {
  return (
    <div style={{
      width: 320, padding: '36px 28px 28px', background: '#0f0c09', border: '1px solid rgba(255,232,200,0.08)',
      borderRadius: 20, color: '#f6e9d2', fontFamily: 'DM Sans, sans-serif',
      display: 'flex', flexDirection: 'column', justifyContent: 'space-between', minHeight: 200,
    }}>
      <div>
        <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 11, letterSpacing: '0.12em', color: '#B85839', textTransform: 'uppercase' }}>{data.tag}</div>
        <h2 style={{ fontFamily: 'Instrument Serif, serif', fontSize: 56, lineHeight: 0.95, margin: '14px 0 18px', fontStyle: 'italic', color: '#f6e9d2' }}>{data.title}</h2>
        <p style={{ fontSize: 14, lineHeight: 1.55, color: 'rgba(246,233,210,0.65)', margin: 0 }}>{data.subtitle}</p>
      </div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas
      title="BipolTrack — redesign chaleureux"
      subtitle="3 directions éditoriales · saisie réimaginée · feedback après chaque journée"
      background="#171310"
    >
      <DCSection id="overview" title="Vue d'ensemble" subtitle="Trois prises de parti pour la même app — comparer la posture émotionnelle de chacune.">
        <DCArtboard id="argile-cover"   label="Argile · couverture"   width={320} height={PHONE_H} style={{ background: '#0f0c09' }}><IntroCard data={INTRO.argile} /></DCArtboard>
        <DCArtboard id="saison-cover"   label="Saison · couverture"   width={320} height={PHONE_H} style={{ background: '#0f0c09' }}><IntroCard data={INTRO.saison} /></DCArtboard>
        <DCArtboard id="almanach-cover" label="Almanach · couverture" width={320} height={PHONE_H} style={{ background: '#0f0c09' }}><IntroCard data={INTRO.almanach} /></DCArtboard>
      </DCSection>

      <DCSection id="argile" title="01 · Argile" subtitle="Saisie en 3 temps — Humeur, Corps, Mot. Mood-orb glissé sur une piste d'argile.">
        <DCArtboard id="argile-empty"   label="Premier jour"  width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><ArgileApp initialScreen="empty" /></DCArtboard>
        <DCArtboard id="argile-journal" label="Humeur"        width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><ArgileApp initialScreen="journal" /></DCArtboard>
        <DCArtboard id="argile-corps"   label="Corps"         width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><ArgileApp initialScreen="corps" /></DCArtboard>
        <DCArtboard id="argile-mot"     label="Mot"           width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><ArgileApp initialScreen="mot" /></DCArtboard>
        <DCArtboard id="argile-done"    label="Récompense"     width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><ArgileApp initialScreen="done" /></DCArtboard>
        <DCArtboard id="argile-news"    label="News · synthèse" width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><ArgileApp initialScreen="news" /></DCArtboard>
        <DCArtboard id="argile-deep"    label="Carnet annuel"  width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><ArgileApp initialScreen="stats-deep" /></DCArtboard>
        <DCArtboard id="argile-hist"    label="Historique"     width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><ArgileApp initialScreen="history" /></DCArtboard>
        <DCArtboard id="argile-meds"    label="Soins"          width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><ArgileApp initialScreen="meds" /></DCArtboard>
        <DCArtboard id="argile-report"  label="Rapport médecin" width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><ArgileApp initialScreen="report" /></DCArtboard>
        <DCArtboard id="argile-set"     label="Réglages"       width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><ArgileApp initialScreen="settings" /></DCArtboard>
      </DCSection>

      <DCSection id="saison" title="02 · Saison" subtitle="Le ciel intérieur. L'humeur n'est plus un chiffre, c'est une météo qu'on peint.">
        <DCArtboard id="saison-journal" label="Le ciel"   width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><SaisonApp initialScreen="journal" /></DCArtboard>
        <DCArtboard id="saison-detail"  label="Détails"   width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><SaisonApp initialScreen="detail" /></DCArtboard>
        <DCArtboard id="saison-done"    label="Bulletin"  width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><SaisonApp initialScreen="done" /></DCArtboard>
        <DCArtboard id="saison-cal"     label="Année"     width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><SaisonApp initialScreen="calendar" /></DCArtboard>
      </DCSection>

      <DCSection id="almanach" title="03 · Almanach" subtitle="Un journal-papier numérique. Long-form, intime, en chapitres.">
        <DCArtboard id="almanach-journal" label="Chapitres"   width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><AlmanachApp initialScreen="journal" /></DCArtboard>
        <DCArtboard id="almanach-mood"    label="Glyphes"     width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><AlmanachApp initialScreen="mood" /></DCArtboard>
        <DCArtboard id="almanach-done"    label="Page close"  width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><AlmanachApp initialScreen="done" /></DCArtboard>
        <DCArtboard id="almanach-hist"    label="Recueil"     width={PHONE_W} height={PHONE_H} style={{ background: 'transparent' }}><AlmanachApp initialScreen="history" /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
