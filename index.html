<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>BipolTrack</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }
  /* height: 100dvh suit la hauteur visible réelle (barre d'adresse Chrome
     mobile incluse) ; sans ça la nav du bas, en bottom:0 d'un bloc 100vh,
     passe sous la barre et disparaît. 100vh reste en repli pour les
     navigateurs sans dvh. Safari plein écran reste identique. */
  #root { width: 100vw; height: 100vh; height: 100dvh; }
  .stage {
    width: 100%; height: 100%;
    display: flex; align-items: stretch;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="variations/v1-argile.jsx?v=202605310003"></script>
<script type="text/babel" src="variations/argile-extras.jsx?v=202605310003"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

const TWEAK_DEFAULTS = {
  "orbFinish": "lisse",
  "startScreen": "journal"
};

const SCREEN_OPTIONS = [
  { v: 'empty',      l: 'Premier jour' },
  { v: 'journal',    l: 'Journal · Humeur' },
  { v: 'corps',      l: 'Journal · Corps' },
  { v: 'mot',        l: 'Journal · Mot' },
  { v: 'done',       l: 'Récompense (anim)' },
  { v: 'news',       l: 'News · synthèse' },
  { v: 'stats-deep', l: 'Carnet annuel' },
  { v: 'history',    l: 'Historique' },
  { v: 'meds',       l: 'Soins' },
  { v: 'report',     l: 'Rapport médecin' },
  { v: 'settings',   l: 'Réglages' },
  { v: 'cycle',      l: 'Humeur × Cycle' },
];

function ArgileStage() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <>
      <div className="stage">
        <ArgileApp
          key={tweaks.startScreen + tweaks.orbFinish}
          initialScreen={tweaks.startScreen}
          tweaks={{ finish: tweaks.orbFinish }}
        />
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Démarrer sur" />
        <TweakSelect
          label="Écran"
          value={tweaks.startScreen}
          options={SCREEN_OPTIONS.map(o => ({ value: o.v, label: o.l }))}
          onChange={(v) => setTweak('startScreen', v)}
        />

        <TweakSection label="Finition de l'orbe" />
        <TweakRadio
          label="Style"
          value={tweaks.orbFinish}
          options={[
            { value: 'lisse',   label: 'Lisse' },
            { value: 'texture', label: 'Texture' },
            { value: 'nacre',   label: 'Nacre' },
          ]}
          onChange={(v) => setTweak('orbFinish', v)}
        />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ArgileStage />);
</script>
</body>
</html>
